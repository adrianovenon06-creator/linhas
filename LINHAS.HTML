
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Linhas Animadas — Fundo Transparente</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  body {
    display: grid;
    place-items: center;
  }

  #stage {
    position: relative;
    height: 100dvh;
    aspect-ratio: 9 / 16;
    max-width: 100vw;
    max-height: 100dvh;
    overflow: hidden;
    background: transparent;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: transparent;
  }

  @media (max-aspect-ratio: 9/16) {
    #stage {
      width: 100vw;
      height: auto;
      aspect-ratio: 9 / 16;
    }
  }
</style>
</head>

<body>
<div id="stage">
  <canvas id="fx"></canvas>
</div>

<script>
(() => {
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d', { alpha: true });

  let w = 720;
  let h = 1280;
  let dpr = 1;

  const lines = [];
  const MAX_LINES = 2;
  const SPAWN_INTERVAL = 1.6;

  const rand = (min, max) =>
    min + Math.random() * (max - min);

  const pick = arr =>
    arr[Math.floor(Math.random() * arr.length)];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    const rect = canvas.getBoundingClientRect();
    w = Math.max(1, rect.width);
    h = Math.max(1, rect.height);

    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  window.addEventListener('resize', resize);

  function newLine() {
    const direction = pick(['left', 'right', 'up', 'down']);
    const diagonal = Math.random() < 0.12;
    const life = rand(3.2, 5.0);

    let x, y, vx, vy, length, angle;

    if (direction === 'left' || direction === 'right') {
      // Linha horizontal: comprimento baseado na largura da tela.
      x = direction === 'left' ? w + 12 : -12;
      y = rand(0, h);

      vx =
        (direction === 'left' ? -1 : 1) *
        (w * 1.15 + h * 0.25) / life;

      vy = diagonal
        ? rand(-h * 0.10, h * 0.10) / life
        : 0;

      length = rand(w * 1.15, w * 1.55);
      angle = diagonal ? rand(-0.25, 0.25) : 0;

    } else {
      // Linha vertical: comprimento baseado na altura da tela.
      x = rand(0, w);
      y = direction === 'up' ? h + 12 : -12;

      vx = diagonal
        ? rand(-w * 0.10, w * 0.10) / life
        : 0;

      vy =
        (direction === 'up' ? -1 : 1) *
        (h * 1.15 + w * 0.25) / life;

      length = rand(h * 1.15, h * 1.55);
      angle = diagonal
        ? Math.PI / 2 + rand(-0.25, 0.25)
        : Math.PI / 2;
    }

    return {
      x, y, vx, vy, length, angle,
      age: 0,
      life,
      width: Math.random() < 0.14 ? 1.15 : 0.55,
      alpha: rand(0.42, 0.68),
      tone: Math.floor(rand(205, 241))
    };
  }

  function drawLine(line) {
    const progress = line.age / line.life;

    // Entrada e saída suaves.
    const fade = Math.min(
      1,
      progress * 5,
      (1 - progress) * 5
    );

    const alpha = Math.max(0, fade) * line.alpha;

    ctx.strokeStyle =
      `rgba(${line.tone},${line.tone},${line.tone},${alpha})`;

    ctx.lineWidth = line.width;
    ctx.lineCap = 'butt';

    ctx.beginPath();

    const dx = Math.cos(line.angle) * line.length / 2;
    const dy = Math.sin(line.angle) * line.length / 2;

    ctx.moveTo(line.x - dx, line.y - dy);
    ctx.lineTo(line.x + dx, line.y + dy);

    ctx.stroke();
  }

  let previous = 0;
  let spawnClock = 0;

  function frame(now) {
    const dt = Math.min((now - previous) / 1000 || 0, 0.05);
    previous = now;

    // Apaga o quadro sem criar fundo opaco nem rastros.
    ctx.clearRect(0, 0, w, h);

    spawnClock += dt;

    if (spawnClock >= SPAWN_INTERVAL) {
      spawnClock = 0;

      if (lines.length < MAX_LINES) {
        lines.push(newLine());
      }
    }

    for (let i = lines.length - 1; i >= 0; i--) {
      const line = lines[i];

      line.age += dt;
      line.x += line.vx * dt;
      line.y += line.vy * dt;

      if (line.age >= line.life) {
        lines.splice(i, 1);
      } else {
        drawLine(line);
      }
    }

    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
